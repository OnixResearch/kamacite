[workspace]
members = [
  "crates/taenite-core",
  "crates/taenite-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OnixResearch/taenite"
rust-version = "1.88"

[workspace.dependencies]
blake3 = "1.8.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
