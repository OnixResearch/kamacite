[workspace]
members = [
  "crates/kamacite-core",
  "crates/kamacite-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OnixResearch/kamacite"
rust-version = "1.88"

[workspace.dependencies]
blake3 = "1.8.2"
preserves = { version = "5.0.0-rc.7", features = ["serde"] }
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
